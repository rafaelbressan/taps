# Portão de QA do TAPS.
#
# Duas coisas que este arquivo impõe e que nenhuma suíte unitária impõe:
#
#  1. O harness de payout precisa provar que **consegue reprovar** (`selftest`).
#     Cobertura alta não é validação; um teste que não pode falhar não é um teste.
#  2. Se a entrega diz três alvos, o portão vê os três buildarem. Alvos definidos pela
#     ADR-0001: **Linux, Windows e Android**. Apple está fora do escopo — não acrescente
#     um job de macOS/iOS aqui sem emendar a ADR.
#
# Nenhum passo usa `continue-on-error`. Um portão que deixa passar não é um portão.
#
# O job de build fica **pulado** enquanto o app do TAPS não existe (ele chega no
# estágio 5, BRES-48/49), e passa a valer sozinho no commit que criar
# `src-tauri/Cargo.toml`. Decisão de Rafael em 2026-08-30, BRES-44.
#
# Pulado é diferente de verde: o GitHub mostra o job em cinza, não em verde, então
# ninguém lê "buildou" onde não buildou. E é diferente de vermelho: um `main` vermelho
# por semanas ensina a squad a ignorar o CI, que foi exatamente como os 12 erros TS2300
# sobreviveram no `main` sem ninguém notar.
#
# Ninguém precisa lembrar de ligar o job depois. O `detect-app` abaixo faz isso.

name: QA Gate

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: qa-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.x'

jobs:
  harness-selftest:
    name: Harness — os cenários conseguem reprovar?
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qa-harness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: qa-harness/package-lock.json
      - run: npm ci
      - name: Tipos
        run: npm run typecheck

      # `--offline` não faz uma única chamada de rede: coorte gerado em memória, taxa e
      # gas de fixture gravada, nada injetado. É o que cabe num CI de PR — sem chave, sem
      # faucet, sem baker provisionado — e ainda assim é um portão de verdade: os seis
      # mutantes de plano reprovam aqui igual reprovam contra a cadeia.
      #
      # O que este job NÃO prova: nada sobre movimentação de dinheiro. Idempotência,
      # conta não alocada e reconciliação exigem a cadeia, e ficam no `payout-bakingnet`.
      - name: Selftest (mutantes de plano, sem rede)
        run: npm run selftest -- --offline

  # Descobre se já existe app para buildar. Precisa ser um job com checkout: `hashFiles()`
  # num `if` de job roda ANTES do checkout, sobre um workspace vazio, e devolveria sempre
  # "não existe" — inclusive depois do app existir. O portão nunca mais armaria.
  detect-app:
    name: Existe app para buildar?
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        shell: bash
        run: |
          if [ -f src-tauri/Cargo.toml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "src-tauri/Cargo.toml existe — o portão de build está ARMADO."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::src-tauri/Cargo.toml não existe: o app do TAPS ainda não foi criado (BRES-48/BRES-49)."
            echo "::notice::O job de build fica pulado e passa a valer sozinho no commit que criar esse arquivo."
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: detect-app
    if: needs.detect-app.outputs.exists == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            os: ubuntu-latest
          - target: windows
            os: windows-latest
          - target: android
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Dependências de sistema (Tauri no Linux)
        if: matrix.target == 'linux' || matrix.target == 'android'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - name: Alvos Rust para Android
        if: matrix.target == 'android'
        run: rustup target add aarch64-linux-android armv7-linux-androideabi

      - uses: actions/setup-java@v4
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        if: matrix.target == 'android'

      - name: NDK
        if: matrix.target == 'android'
        run: |
          sdkmanager "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"

      # Chegar aqui já significa que `src-tauri/Cargo.toml` existe — `detect-app` conferiu.
      # A partir deste ponto não há saída silenciosa: se o build falhar, o portão fecha.
      - name: Build do alvo
        shell: bash
        run: |
          npm ci
          case "${{ matrix.target }}" in
            android) npm run tauri -- android build ;;
            *)       npm run tauri -- build ;;
          esac

  # Rodada real em Bakingnet: dinheiro se move, e o resultado é conferido contra a
  # cadeia. Não roda em PR de fora — precisa de chave e de faucet, e leva minutos.
  payout-bakingnet:
    name: Payout ponta a ponta em Bakingnet
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qa-harness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: qa-harness/package-lock.json
      - run: npm ci
      - name: Provisionar baker e coorte
        run: npm run setup -- --stage accounts --fund 8000
      - name: Distribuição, reconciliação e idempotência
        run: npm run run
      - name: Selftest completo (inclui mutantes de cadeia)
        run: npm run selftest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorios-qa
          path: qa-harness/reports/
