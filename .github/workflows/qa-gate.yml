# Portão de QA do TAPS.
#
# Duas coisas que este arquivo impõe e que nenhuma suíte unitária impõe:
#
#  1. O harness de payout precisa provar que **consegue reprovar** (`selftest`).
#     Cobertura alta não é validação; um teste que não pode falhar não é um teste.
#  2. Se a entrega diz três alvos, o portão vê os três buildarem. Alvos definidos pela
#     ADR-0001: **Linux, Windows e Android**. Apple está fora do escopo — não acrescente
#     um job de macOS/iOS aqui sem emendar a ADR.
#
# Nenhum passo usa `continue-on-error`. Um portão que deixa passar não é um portão.

name: QA Gate

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: qa-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.x'

jobs:
  harness-selftest:
    name: Harness — os cenários conseguem reprovar?
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qa-harness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: qa-harness/package-lock.json
      - run: npm ci
      - name: Tipos
        run: npm run typecheck

      # `--plan-only` roda os mutantes que não precisam mover dinheiro. É o que cabe num
      # CI de PR: sem chave, sem faucet, sem injeção. A rodada completa contra Bakingnet
      # é o job `payout-bakingnet` abaixo, que exige coorte já provisionado.
      - name: Selftest (mutantes de plano)
        run: npm run selftest -- --plan-only

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            os: ubuntu-latest
          - target: windows
            os: windows-latest
          - target: android
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Dependências de sistema (Tauri no Linux)
        if: matrix.target == 'linux' || matrix.target == 'android'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - name: Alvos Rust para Android
        if: matrix.target == 'android'
        run: rustup target add aarch64-linux-android armv7-linux-androideabi

      - uses: actions/setup-java@v4
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        if: matrix.target == 'android'

      - name: NDK
        if: matrix.target == 'android'
        run: |
          sdkmanager "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"

      # O app do TAPS chega no estágio 5 (BRES-48/BRES-49). Enquanto ele não existe,
      # este passo falha em voz alta em vez de reportar verde para um build que não
      # aconteceu. Um portão que passa sem verificar nada é pior que portão nenhum.
      - name: Build do alvo
        shell: bash
        run: |
          if [ ! -f src-tauri/Cargo.toml ]; then
            echo "::error::src-tauri/Cargo.toml não existe — o app do TAPS ainda não foi criado (BRES-48/BRES-49)."
            echo "Quando existir, este passo roda \`tauri build\` para ${{ matrix.target }}."
            exit 1
          fi
          npm ci
          case "${{ matrix.target }}" in
            android) npm run tauri -- android build ;;
            *)       npm run tauri -- build ;;
          esac

  # Rodada real em Bakingnet: dinheiro se move, e o resultado é conferido contra a
  # cadeia. Não roda em PR de fora — precisa de chave e de faucet, e leva minutos.
  payout-bakingnet:
    name: Payout ponta a ponta em Bakingnet
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qa-harness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: qa-harness/package-lock.json
      - run: npm ci
      - name: Provisionar baker e coorte
        run: npm run setup -- --stage accounts --fund 8000
      - name: Distribuição, reconciliação e idempotência
        run: npm run run
      - name: Selftest completo (inclui mutantes de cadeia)
        run: npm run selftest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorios-qa
          path: qa-harness/reports/
